name: Build Delivery APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create --platforms=android .
      - run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <application/' "$MANIFEST"
          fi

          GRADLE="android/app/build.gradle.kts"
          if [ ! -f "$GRADLE" ]; then
            GRADLE="android/app/build.gradle"
          fi

          if [[ "$GRADLE" == *.kts ]]; then
            if ! grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE"; then
              sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$GRADLE"
            fi
            if ! grep -q "coreLibraryDesugaring(" "$GRADLE"; then
              printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n' >> "$GRADLE"
            fi
          else
            if ! grep -q "coreLibraryDesugaringEnabled" "$GRADLE"; then
              sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' "$GRADLE"
            fi
            if ! grep -q "coreLibraryDesugaring " "$GRADLE"; then
              printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n' >> "$GRADLE"
            fi
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: deua-delivery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
